name: sfi-madagascar
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas>=2.2
  - scipy
  - geopandas
  - fiona
  - rasterio
  - shapely
  - pyproj
  - scikit-learn
  - statsmodels>=0.14
  - patsy>=0.5
  - matplotlib>=3.8
  - seaborn
  - numba
  - tqdm
  - openpyxl>=3.1
  - pip
  - pip:
      - optuna
      - shap
      - joblib
      - pykrige
      - kagglehub

# For the GPU raster-prediction scripts (cuML, cuPy), create a SEPARATE
# RAPIDS environment instead of adding those packages here -- see
# requirements-gpu.txt for the recommended install command.
